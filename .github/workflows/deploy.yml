name: Redeploy to Cloud Run
# Deploy verified changes to the existing service on main, or run manually.
# It needs one repository secret, GCP_SA_KEY (see the README section "Redeploying").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROJECT_ID: corinne-portfolio
      REGION: us-central1
      SERVICE: pc-do-betting-odds-match-real-results-a-mar
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Google Cloud key
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Add the GCP_SA_KEY secret first. See README > Redeploying."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" --source . --project "$PROJECT_ID" --region "$REGION" \
            --allow-unauthenticated --memory 1Gi --cpu 1 --min-instances 0 --max-instances 2 \
            --timeout 3600 --session-affinity --quiet
