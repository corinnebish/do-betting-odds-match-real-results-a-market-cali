name: Redeploy to Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
  deploy:
    needs: verify
    uses: ./.github/workflows/cloud-run-reusable.yml
    with:
      service: pc-do-betting-odds-match-real-results-a-mar
